<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>سراج فون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
:root{--bg:#0a0e1a;--bg2:#121830;--glass:rgba(255,255,255,.05);--bd:rgba(255,255,255,.09);--tx:#f1f3fa;--mut:#8f98b3;--v:#f5b942;--c:#2dd4bf;--a:#ffd27a;--ok:#34d399;--bad:#fb7185;--grad:linear-gradient(135deg,#f5b942,#f97316);--ink:#1a1204}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh;
background-image:radial-gradient(800px 500px at 90% -8%,rgba(245,185,66,.16),transparent 60%),radial-gradient(700px 520px at 0% 30%,rgba(45,212,191,.1),transparent 60%);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
.num,.pr{font-family:'Space Grotesk',Tajawal,sans-serif}
a{color:var(--c)}
/* الهيكل */
header{position:sticky;top:0;z-index:30;backdrop-filter:blur(18px);background:rgba(10,14,26,.78);border-bottom:1px solid var(--bd);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.bar,main{max-width:1120px;margin-inline:auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:10px;line-height:1.15}
.logo svg{flex:none;filter:drop-shadow(0 4px 14px rgba(245,158,11,.45))}
.logo span{display:flex;flex-direction:column;font-weight:800;font-size:21px}
.logo small{font-size:10.5px;font-weight:500;color:var(--mut);letter-spacing:.3px}
.who{display:flex;gap:8px;align-items:center;font-size:13px}
.wallet{display:flex;align-items:center;gap:7px;padding:6px 13px;border-radius:99px;border:1px solid var(--bd);background:var(--glass)}
.wallet:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.who>.btn:not(.sec)::before{content:"π";font-family:'Space Grotesk';font-weight:700;margin-inline-end:7px}
nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:40;display:flex;gap:4px;padding:6px;background:rgba(18,24,48,.86);backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:24px;box-shadow:0 16px 44px -10px rgba(0,0,0,.75);max-width:calc(100% - 20px)}
nav button,nav a{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:66px;padding:7px 12px;border-radius:18px;background:none;border:0;color:var(--mut);font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .2s,color .2s}
nav i{font-style:normal;font-size:19px;line-height:1.2}
nav button:hover,nav a:hover{color:#fff}
nav button.on{background:var(--grad);color:var(--ink)}
main{padding:18px 14px 120px}
/* الواجهة الرئيسية */
.hero{position:relative;overflow:hidden;border:1px solid var(--bd);border-radius:30px;padding:40px 28px;margin-bottom:16px;background:linear-gradient(135deg,rgba(245,185,66,.16),rgba(45,212,191,.06) 65%);display:grid;grid-template-columns:1.3fr 1fr;gap:10px;align-items:center;box-shadow:0 30px 80px -40px rgba(245,158,11,.5),inset 0 1px 0 rgba(255,255,255,.08)}
.hero:after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:22px 22px;-webkit-mask-image:linear-gradient(120deg,#000,transparent 70%);mask-image:linear-gradient(120deg,#000,transparent 70%)}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:clamp(34px,7vw,56px);font-weight:800;line-height:1.1;background:linear-gradient(90deg,#fff,#ffe1a1 60%,#f5b942);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);margin:10px 0 18px;max-width:44ch}
.hero .row{gap:10px}.hero .row>*{flex:none}
.orb{position:relative;aspect-ratio:1;max-width:240px;margin:auto;width:100%;display:grid;place-items:center}
.orb:before{content:"";position:absolute;inset:6%;border-radius:50%;background:conic-gradient(from 0deg,#f5b942,#f97316,#2dd4bf,#f5b942);filter:blur(28px);opacity:.6;animation:spin 10s linear infinite}
.orb:after{content:"";position:absolute;inset:1%;border-radius:50%;border:1px dashed rgba(255,255,255,.22);animation:spin 30s linear infinite reverse}
.orb b{position:relative;width:62%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font:700 clamp(58px,11vw,92px) 'Space Grotesk';color:#fff;background:radial-gradient(circle at 30% 25%,#2a3156,#0a0e1a);border:1px solid rgba(255,255,255,.18);text-shadow:0 0 30px rgba(245,185,66,.9);box-shadow:inset 0 0 40px rgba(245,185,66,.3)}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.orb:before,.orb:after{animation:none}html{scroll-behavior:auto}}
@media(max-width:640px){.hero{grid-template-columns:1fr;padding:26px 18px}.orb{max-width:130px;order:-1}.logo small{display:none}}
.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:26px}
.perk{display:flex;gap:11px;align-items:center;padding:12px 14px;border:1px solid var(--bd);border-radius:18px;background:var(--glass);font-size:14px;font-weight:700}
.perk i{font-style:normal;font-size:22px;width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:rgba(245,185,66,.14);flex:none}
.perk small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.sech{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
.sech h2{font-size:22px;font-weight:800}
.sech h2:after{content:"";display:block;width:38px;height:4px;border-radius:4px;background:var(--grad);margin-top:5px}
/* النماذج */
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:14px;background:rgba(255,255,255,.05);transition:border-color .2s,box-shadow .2s}
select option{background:#151b35}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--v);box-shadow:0 0 0 3px rgba(245,185,66,.22)}
button:focus-visible,a:focus-visible{outline:2px solid var(--c);outline-offset:2px}
textarea{min-height:84px;resize:vertical}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}
.search{position:relative;margin-bottom:12px}
.search input{padding-inline-start:44px;border-radius:99px;background:rgba(255,255,255,.07)}
.search:before{content:"🔍";position:absolute;inset-inline-start:15px;top:50%;transform:translateY(-50%);font-size:16px;opacity:.7}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;margin-bottom:6px}
.chip{border:1px solid var(--bd);background:var(--glass);border-radius:99px;padding:7px 18px;cursor:pointer;white-space:nowrap;color:var(--mut);transition:all .2s}
.chip:hover{border-color:rgba(245,185,66,.6);color:#fff}
.chip.on{background:var(--grad);border-color:transparent;color:var(--ink);font-weight:800}
/* المنتجات */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--bd);border-radius:22px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-6px);border-color:rgba(245,185,66,.6);box-shadow:0 16px 44px -12px rgba(245,158,11,.45)}
.ph{aspect-ratio:1;background:radial-gradient(circle at 50% 30%,#232b52,#0d1226);display:grid;place-items:center;font-size:48px;position:relative;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .ph img{transform:scale(1.08)}
.cnt{position:absolute;bottom:8px;left:8px;font-size:12px;background:rgba(10,14,26,.78);padding:1px 9px;border-radius:99px;border:1px solid var(--bd)}
.sold{position:absolute;top:8px;right:8px;background:var(--bad);color:#150010;font-weight:800;font-size:12px;padding:2px 9px;border-radius:8px}
.card h3{font-size:15.5px;padding:11px 13px 0;font-weight:700}
.rt{padding:0 13px;font-size:13px;color:var(--a);letter-spacing:1px}.rt small{color:var(--mut);letter-spacing:0}
.pr{margin:6px 13px 13px;font-weight:700;font-size:18px;color:var(--a)}
/* الأزرار */
.btn{display:inline-block;text-align:center;text-decoration:none;background:var(--grad);color:var(--ink);border:0;border-radius:14px;padding:12px 20px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px -8px rgba(245,158,11,.6);transition:filter .15s,transform .1s,box-shadow .2s}
.btn:hover{filter:brightness(1.08);box-shadow:0 12px 30px -8px rgba(245,158,11,.7)}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:var(--glass);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.btn.bad{background:var(--bad);color:#1a0008;box-shadow:none}.btn.ok{background:var(--ok);color:#00170d;box-shadow:none}.btn.sm{padding:8px 14px;font-size:13px;border-radius:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.row .btn,.row .tag{flex:none}
.box{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid var(--bd);border-radius:20px;padding:15px;margin-bottom:12px}
.tag{display:inline-block;padding:2px 11px;border-radius:99px;font-size:12px;font-weight:700;background:rgba(245,185,66,.15);color:var(--a);border:1px solid rgba(245,185,66,.35)}
.tag.g{background:rgba(52,211,153,.12);color:var(--ok);border-color:rgba(52,211,153,.35)}.tag.r{background:rgba(251,113,133,.12);color:var(--bad);border-color:rgba(251,113,133,.35)}.tag.y{background:rgba(251,191,36,.12);color:#fbbf24;border-color:rgba(251,191,36,.35)}
.mut{color:var(--mut);font-size:13px}.ttl{font-weight:800;font-size:20px;margin:4px 0 12px}
/* النوافذ */
.modal{position:fixed;inset:0;background:rgba(4,6,14,.74);backdrop-filter:blur(6px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:linear-gradient(180deg,#171e3c,#0d1226);border:1px solid rgba(255,255,255,.14);width:100%;max-width:580px;max-height:93vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px -20px rgba(245,158,11,.25)}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:26px}}
.x{float:left;background:var(--glass);border:1px solid var(--bd);border-radius:50%;width:34px;height:34px;cursor:pointer}
.gal{position:relative}.big{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px;background:#0d1226;display:block}
.thumbs{display:flex;gap:7px;margin-top:8px;overflow-x:auto}.thumbs img{width:62px;height:62px;object-fit:cover;border-radius:12px;border:2px solid transparent;cursor:pointer;opacity:.7}.thumbs img.on{border-color:var(--v);opacity:1}
.stars button{background:none;border:0;font-size:30px;color:rgba(255,255,255,.18);cursor:pointer;padding:0 2px}.stars button.on{color:var(--a)}
.rev{border-top:1px solid var(--bd);padding:9px 0;font-size:14px}
.sum{background:rgba(245,185,66,.09);border:1px solid rgba(245,185,66,.28);border-radius:14px;padding:11px 13px;font-size:14px;margin-top:12px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat div{background:linear-gradient(135deg,rgba(245,185,66,.1),rgba(255,255,255,.03));border:1px solid var(--bd);border-radius:18px;padding:14px;color:var(--mut);font-size:14px}.stat b{display:block;font:700 28px 'Space Grotesk';background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;border:1px dashed var(--bd);background:var(--glass);display:grid;place-items:center;color:var(--mut);font-size:13px;cursor:pointer;text-align:center}
.slot img{width:100%;height:100%;object-fit:cover}.slot.full{border-style:solid}
.slot .rm,.slot .cv{position:absolute;top:4px;background:rgba(10,14,26,.82);border:1px solid var(--bd);color:#fff;border-radius:8px;font-size:12px;padding:1px 7px;cursor:pointer}
.slot .rm{right:4px}.slot .cv{left:4px}
.slot input{display:none}
.toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#1a2144;border:1px solid var(--v);color:#fff;padding:11px 20px;border-radius:14px;z-index:99;max-width:90vw;font-size:14px;box-shadow:0 10px 40px rgba(245,158,11,.3)}
.empty{text-align:center;color:var(--mut);padding:44px 10px}
.skel{height:230px;border-radius:22px;background:linear-gradient(90deg,var(--glass),rgba(255,255,255,.09),var(--glass));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
.hash{font-family:'Space Grotesk',monospace;font-size:12px;word-break:break-all}
/* الموقع والتذييل */
.loc{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-top:34px;padding:22px;border:1px solid var(--bd);border-radius:28px;background:linear-gradient(135deg,rgba(45,212,191,.1),rgba(245,185,66,.07));overflow:hidden}
.loc h2{font-size:22px;font-weight:800;margin-bottom:6px}
.loc p{color:var(--mut);margin-bottom:14px}
.loc .row{gap:10px}.loc .row>*{flex:none}
.mapart{position:relative;min-height:170px;border-radius:20px;border:1px solid var(--bd);display:grid;place-items:center;text-decoration:none;color:var(--tx);font-weight:800;
background:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px),radial-gradient(circle at 50% 50%,rgba(45,212,191,.2),#0d1226 75%);background-size:28px 28px,28px 28px,auto}
.mapart i{font-style:normal;font-size:44px;display:block;text-align:center;animation:bob 2.2s ease-in-out infinite}
.mapart span{display:block;text-align:center;font-size:14px}
@keyframes bob{50%{transform:translateY(-7px)}}
@media(prefers-reduced-motion:reduce){.mapart i{animation:none}}
@media(max-width:640px){.loc{grid-template-columns:1fr;padding:18px}}
footer{margin-top:26px;padding-top:18px;border-top:1px solid var(--bd);text-align:center}
footer .links{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
footer .links a{padding:6px 16px;border:1px solid var(--bd);border-radius:99px;background:var(--glass);color:var(--tx);text-decoration:none;font-size:13px;font-weight:700}
footer .links a:hover{border-color:rgba(245,185,66,.6)}
footer .adm{background:none;border:0;color:var(--mut);font-size:12px;cursor:pointer;text-decoration:underline;margin-top:6px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">
      <svg viewBox="0 0 48 48" width="42" height="42" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#f97316"/></linearGradient></defs>
        <rect width="48" height="48" rx="15" fill="url(#lg)"/>
        <rect x="14.5" y="7" width="19" height="34" rx="5" fill="#0a0e1a"/>
        <path d="M24 10.5c3 3 4.2 5 4.2 6.9a4.2 4.2 0 0 1-8.4 0c0-1.9 1.2-3.9 4.2-6.9z" fill="#ffd27a"/>
        <path d="M24 14.5c1.2 1.3 1.7 2.2 1.7 3a1.7 1.7 0 0 1-3.4 0c0-.8.5-1.7 1.7-3z" fill="#f97316"/>
        <text x="24" y="35" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-weight="700" font-size="14" fill="#fff">π</text>
      </svg>
      <span>سراج فون<small>هواتف · إكسسوارات · Pi</small></span>
    </div>
    <div class="who" id="who"></div>
  </div>
</header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="modal"></div>

<script>
/* ===== إعدادات المحل: ضع رابط خرائط جوجل وعنوان المحل هنا ===== */
const MAP_URL='https://maps.app.goo.gl/fvZn8gG2fHDer4us5?g_st=ac';            // مثال: 'https://maps.app.goo.gl/xxxxxxxx'
const SHOP_ADDR='';          // مثال: 'العراق، بغداد، شارع ... بالقرب من ...'

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={token:localStorage.getItem('sf_token')||'',user:null,admin:false,cfg:{},products:[],loaded:false,cat:'all',q:'',view:'store',atab:'summary',pimgs:[],newPids:[],star:5};
const GOV=['بغداد','البصرة','نينوى','أربيل','السليمانية','دهوك','كركوك','الأنبار','ديالى','صلاح الدين','بابل','كربلاء','النجف','الديوانية','واسط','ميسان','ذي قار','المثنى'];
const ST={paid:['مدفوع - بانتظار التجهيز','y'],processing:['قيد التجهيز',''],shipped:['في الطريق إليك',''],delivered:['تم التسليم','g'],refunded:['تم الاسترجاع','r']};
const RF={requested:['طلب الاسترجاع قيد المراجعة','y'],processing:['جارٍ تحويل المبلغ','y'],rejected:['رُفض طلب الاسترجاع','r'],refunded:['أُعيد المبلغ إلى محفظتك','g']};
const fmt=t=>t?new Date(t).toLocaleString('ar-IQ'):'';
const stars=n=>{n=Math.round(n);return '★'.repeat(n)+'☆'.repeat(5-n)};
const thumb=(u,w)=>String(u).replace('/upload/',`/upload/f_auto,q_auto,w_${w}/`);
const txLink=t=>`https://blockexplorer.minepi.com/${S.cfg.sandbox?'testnet':'mainnet'}/transactions/${encodeURIComponent(t)}`;
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3400)}
async function api(url,method='GET',body){
  const r=await fetch(url,{method,headers:{'Content-Type':'application/json',...(S.token?{Authorization:'Bearer '+S.token}:{})},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){if(r.status===401&&S.token)logout();throw new Error(d.error||'حدث خطأ')}
  return d;
}
function openModal(h){$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><button class="x" onclick="closeModal()">✕</button>${h}</div></div>`}
function closeModal(){if(S.onClose){const f=S.onClose;S.onClose=null;f()}$('#modal').innerHTML=''}

/* ---------- الدخول ---------- */
function onIncomplete(p){fetch('/api/payments/incomplete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({payment:p})}).catch(()=>{})}
function setSession(d){S.token=d.token;S.user=d.user||{username:'admin'};S.admin=!!d.admin;localStorage.setItem('sf_token',d.token);localStorage.setItem('sf_admin',d.admin?'1':'');chrome()}
function logout(){S.token='';S.user=null;S.admin=false;localStorage.removeItem('sf_token');localStorage.removeItem('sf_admin');S.view='store';chrome();render()}
async function piLogin(){
  if(!window.Pi){toast('افتح التطبيق من متصفح Pi للدفع وتسجيل الدخول');return false}
  try{
    const a=await Pi.authenticate(['username','payments','wallet_address'],onIncomplete);
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accessToken:a.accessToken})});
    const d=await r.json();if(!r.ok)throw new Error(d.error);
    setSession(d);return true;
  }catch(e){toast('تعذر تسجيل الدخول: '+(e.message||e));return false}
}
function adminLogin(){openModal(`<div class="ttl">دخول الإدارة</div><label>كلمة المرور</label><input type="password" id="ap" onkeydown="if(event.key==='Enter')doAdminLogin()"><br><br><button class="btn" style="width:100%" onclick="doAdminLogin()">دخول</button>`)}
async function doAdminLogin(){try{const d=await api('/api/admin/login','POST',{password:$('#ap').value});setSession(d);closeModal();go('admin')}catch(e){toast(e.message)}}

/* ---------- الهيكل ---------- */
function chrome(){
  $('#who').innerHTML=S.user?`<span class="wallet num">π ${esc(S.user.username)}</span><button class="btn sm sec" onclick="logout()">خروج</button>`:`<button class="btn sm" onclick="piLogin()">تسجيل الدخول بباي</button>`;
  const tabs=[['store','🏬','المتجر'],['orders','🧾','طلباتي']];if(S.admin)tabs.push(['admin','⚙️','الإدارة']);
  $('#nav').innerHTML=tabs.map(([k,i,n])=>`<button class="${S.view===k?'on':''}" onclick="go('${k}')"><i>${i}</i><span>${n}</span></button>`).join('')

/* رفع الصور: تصغير في المتصفح ثم رفع مباشر إلى Cloudinary */
function resizeImg(file,max=1000,q=.82){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);c.toBlob(b=>b?res(b):rej(new Error('فشل تصغير الصورة')),'image/jpeg',q)};img.onerror=()=>rej(new Error('ملف الصورة غير صالح'));img.src=URL.createObjectURL(file)})}
function drawSlots(){
  const el=$('#slots');if(!el)return;let h='';
  for(let i=0;i<6;i++){
    const m=S.pimgs[i];
    if(m)h+=`<div class="slot full"><img src="${esc(thumb(m.url,240))}" alt=""><button class="rm" onclick="rmImg(${i})">✕</button>${i?`<button class="cv" onclick="coverImg(${i})">★ غلاف</button>`:'<span class="cv" style="background:var(--v);color:var(--ink)">الغلاف</span>'}</div>`;
    else if(S.uploading&&i===S.pimgs.length)h+='<div class="slot">جارٍ الرفع...</div>';
    else h+=`<label class="slot">+ صورة<input type="file" accept="image/*" multiple onchange="uploadImgs(this.files)"></label>`;
  }
  el.innerHTML=h;
}
async function uploadImgs(files){
  files=[...files].slice(0,6-S.pimgs.length);if(!files.length)return;
  S.uploading=true;drawSlots();
  try{
    const sig=await api('/api/admin/upload-sign','POST');
    for(const f of files){
      try{
        const b=await resizeImg(f),fd=new FormData();
        fd.append('file',b);fd.append('api_key',sig.apiKey);fd.append('timestamp',sig.timestamp);fd.append('signature',sig.signature);fd.append('folder',sig.folder);
        const r=await fetch(`https://api.cloudinary.com/v1_1/${sig.cloudName}/image/upload`,{method:'POST',body:fd});
        const d=await r.json();if(!r.ok)throw new Error((d.error&&d.error.message)||'فشل الرفع');
        S.pimgs.push({url:d.secure_url,pid:d.public_id});S.newPids.push(d.public_id);drawSlots();
      }catch(e){toast(e.message)}
    }
  }catch(e){toast(e.message)}
  S.uploading=false;drawSlots();
}
function rmImg(i){const [m]=S.pimgs.splice(i,1);if(S.newPids.includes(m.pid)){S.newPids=S.newPids.filter(x=>x!==m.pid);api('/api/admin/images/delete','POST',{pids:[m.pid]}).catch(()=>{})}drawSlots()}
function coverImg(i){const [m]=S.pimgs.splice(i,1);S.pimgs.unshift(m);drawSlots()}

  const cats=[...new Set([...(S.aprods||[]).map(x=>x.category),'هواتف','إكسسوارات','شواحن','سماعات','حمايات'])];
  openModal(`<div class="ttl">${id?'تعديل منتج':'منتج جديد'}</div>

const loc=c=>c.lat!=null?` · <a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${c.lat},${c.lng}">الموقع على الخريطة</a>`:'';
function orderBox(o,refundMode){
  const [sl,sc]=ST[o.status]||[o.status,''],c=o.customer,rf=RF[o.refund.status];
  return `<div class="box"><div class="row"><b class="num">${o.id}</b><span class="tag ${sc}">${sl}</span></div>
  <div>${esc(o.productName)} × ${o.qty} — <b class="pr" style="margin:0">${o.totalPi} π</b> <span class="mut">(التوصيل نقداً عند الاستلام)</span></div>
  <div class="mut">${fmt(o.createdAt)} · حساب Pi: ${esc(o.username)}${o.txid?` · <a target="_blank" rel="noopener" href="${txLink(o.txid)}">المعاملة</a>`:''}</div>
  <div style="margin-top:7px"><b>${esc(c.name)}</b> · <a class="num" href="tel:${esc(c.phone)}">${esc(c.phone)}</a><br>${esc(c.governorate)}، ${esc(c.city)}، ${esc(c.address)}${loc(c)}${c.notes?`<br><span class="mut">ملاحظة: ${esc(c.notes)}</span>`:''}</div>
  <div class="mut hash">محفظة الزبون: ${esc(o.wallet||'غير متوفرة')}</div>
  ${rf?`<div style="margin-top:7px"><span class="tag ${rf[1]}">${rf[0]}</span>${o.refund.reason?`<div>السبب: ${esc(o.refund.reason)}</div>`:''}${o.refund.lastError?`<div style="color:var(--bad)">آخر خطأ: ${esc(o.refund.lastError)}</div>`:''}${o.refund.txid?`<div class="mut hash">txid: ${esc(o.refund.txid)}</div>`:''}</div>`:''}
  ${o.refund.status==='requested'?`<div class="row" style="margin-top:9px"><input id="n_${o.id}" placeholder="ملاحظة للزبون (اختياري)"><button class="btn ok sm" onclick="decideRefund('${o.id}','approve',this)">موافقة وإرسال المبلغ</button><button class="btn bad sm" onclick="decideRefund('${o.id}','reject',this)">رفض</button></div>`:''}
  ${!refundMode&&['paid','processing','shipped'].includes(o.status)?`<div class="row" style="margin-top:9px"><select id="s_${o.id}"><option value="processing">قيد التجهيز</option><option value="shipped">في الطريق</option><option value="delivered">تم التسليم</option></select><button class="btn sm" onclick="setStatus('${o.id}')">تحديث</button></div>`:''}</div>`;
}
async function aOrders(){const l=await api('/api/admin/orders');$('#ab').className='';$('#ab').innerHTML=l.length?l.map(o=>orderBox(o)).join(''):'<div class="empty">لا توجد طلبات</div>'}
async function aRefunds(){const l=(await api('/api/admin/orders')).filter(o=>o.refund.status!=='none');l.sort((a,b)=>(b.refund.status==='requested')-(a.refund.status==='requested'));$('#ab').className='';$('#ab').innerHTML=l.length?l.map(o=>orderBox(o,true)).join(''):'<div class="empty">لا توجد طلبات استرجاع</div>'}
async function setStatus(id){try{await api(`/api/admin/orders/${id}/status`,'PUT',{status:$('#s_'+id).value});toast('تم التحديث');renderAdmin()}catch(e){toast(e.message)}}
async function decideRefund(id,action,btn){
  if(action==='approve'&&!confirm('سيُرسل ثمن المنتج إلى محفظة الزبون مباشرة. متابعة؟'))return;
  btn.disabled=true;
  try{await api(`/api/admin/orders/${id}/refund`,'POST',{action,note:$('#n_'+id).value});toast(action==='approve'?'تم إرسال المبلغ ✓':'تم رفض الطلب')}catch(e){toast(e.message)}
  renderAdmin();
}
async function aSettings(){
  const s=await api('/api/admin/settings');$('#ab').className='';
  $('#ab').innerHTML=`<div class="box"><label>هاتف المحل</label><input id="s_ph" value="${esc(s.shopPhone)}"><label>ملاحظة التوصيل (تظهر للزبون)</label><textarea id="s_dn">${esc(s.deliveryNote)}</textarea><label>مدة قبول الاسترجاع (بالأيام)</label><input id="s_rd" type="number" value="${s.refundDays}"><br><br><button class="btn" onclick="saveSettings()">حفظ</button></div>`;
}
async function saveSettings(){try{S.cfg={...S.cfg,...await api('/api/admin/settings','PUT',{shopPhone:$('#s_ph').value,deliveryNote:$('#s_dn').value,refundDays:$('#s_rd').value})};toast('تم الحفظ')}catch(e){toast(e.message)}}

/* ---------- البدء ---------- */
(async function init(){
  S.cfg=await fetch('/api/config').then(r=>r.json()).catch(()=>({}));
  if(window.Pi){try{Pi.init({version:'2.0',sandbox:!!S.cfg.sandbox})}catch(e){}}
  if(S.token&&localStorage.getItem('sf_admin')){S.admin=true;S.user={username:'admin'}}
  chrome();render();
  if(window.Pi&&!S.admin)piLogin();
})();
</script>
</body>
</html>
